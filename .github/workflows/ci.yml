name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# Least privilege: the checks only read the repository. Without an explicit
# block, the workflow runs with the repository's default token scopes, which
# for many repositories includes write access.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Matches the Dockerfile runtime and ships npm >= 11. npm 10 rejects
          # lockfiles written by npm >= 11, which is what Dependabot uses.
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check TypeScript types
        run: npm run check-types

      - name: Check ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run check-formatting

      - name: Run tests
        run: npm test
