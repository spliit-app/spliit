# TEMPORARY - used to verify the native arm64 build works before merging the
# cd.yml rewrite. Deleted in a follow-up commit on this branch.
name: TEMP verify native multi-arch build

on:
  push:
    branches: ['worktree-ci-native-arm64-build']

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner architecture
        run: uname -m

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
          sbom: false
